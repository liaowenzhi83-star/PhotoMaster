name: Build Android APK

# 触发方式：
# 1) 仓库页面 → Actions → 左侧 "Build Android APK" → Run workflow（手动一键）
# 2) 推送到 main / master 分支时自动构建
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  apk:
    name: 编译可安装的 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装依赖
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: 生成原生 Android 工程（expo prebuild）
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install

      - name: 安装缺失的 Android SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null 2>&1 || true

      - name: 用 Gradle 编译 Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 重命名安装包
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/PhotoSweep.apk
          ls -lh out/

      - name: 上传 APK（Artifacts 里下载）
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSweep-APK
          path: out/PhotoSweep.apk
          if-no-files-found: error

      - name: 发布到 Release（手机点链接直接下载安装）
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" out/PhotoSweep.apk \
            --title "PhotoSweep v1.0.${{ github.run_number }}" \
            --notes "自动构建的 Android 安装包（个人测试签名，可直接安装）。" \
            --latest
